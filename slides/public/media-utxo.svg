<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <rect width="480" height="360" rx="20" fill="#fff7ed"/>
  <text x="40" y="46" font-family="Inter,Arial" font-weight="800" font-size="16" fill="#7c2d12">UTXO · không có số dư tài khoản</text>
  <g font-family="Inter,Arial" font-size="13" font-weight="700">
    <rect x="40" y="66" width="120" height="70" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/>
    <text x="100" y="94" text-anchor="middle" fill="#9a3412">INPUTS</text>
    <text x="100" y="114" text-anchor="middle" font-family="monospace" font-weight="400" fill="#431407">UTXO cũ</text>
    <rect x="180" y="66" width="120" height="70" rx="12" fill="#3e5166"/>
    <text x="240" y="94" text-anchor="middle" fill="#fff">TX</text>
    <text x="240" y="114" text-anchor="middle" font-family="monospace" font-weight="400" fill="#e0f2fe">tiêu hủy → tạo</text>
    <rect x="320" y="66" width="120" height="70" rx="12" fill="#34d399"/>
    <text x="380" y="94" text-anchor="middle" fill="#06302a">OUTPUTS</text>
    <text x="380" y="114" text-anchor="middle" font-family="monospace" font-weight="400" fill="#06302a">UTXO mới</text>
  </g>
  <g stroke="#9a3412" stroke-width="2.5" fill="none">
    <line x1="160" y1="101" x2="180" y2="101"/><line x1="300" y1="101" x2="320" y2="101"/>
  </g>
  <rect x="40" y="156" width="400" height="60" rx="12" fill="#111c2b"/>
  <text x="60" y="182" font-family="monospace" font-size="13" fill="#5eead4">phí thợ đào = Σ inputs − Σ outputs</text>
  <text x="60" y="202" font-family="monospace" font-size="12" fill="#cbd5e1">vd: 1.0 − 0.9 − 0.099 = 0.001 BTC phí</text>
  <rect x="40" y="230" width="400" height="90" rx="12" fill="#fef2f2" stroke="#ef4444"/>
  <text x="60" y="256" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#991b1b">Riêng tư &amp; khả hoán (fungibility)</text>
  <text x="60" y="278" font-family="Inter,Arial" font-size="12" fill="#7f1d1d">dòng UTXO truy vết được → blacklist đe dọa</text>
  <text x="60" y="298" font-family="monospace" font-size="11" fill="#7f1d1d">dùng địa chỉ mới mỗi lần nhận (BIP44)</text>
</svg>
